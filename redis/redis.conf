# Redis 配置文件

# 基本配置
bind 0.0.0.0
port 6379

# 持久化配置
save 900 1
save 300 10
save 60 10000

# RDB 文件
dbfilename dump.rdb
dir /data

# AOF 配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# 内存配置
maxmemory 2gb
maxmemory-policy allkeys-lru

# 日志配置
loglevel notice
logfile ""

# 网络配置
tcp-keepalive 300
timeout 0

# 连接数限制
maxclients 10000
