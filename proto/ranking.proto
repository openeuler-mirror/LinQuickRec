syntax = "proto3";

package ranking;

// 排序服务定义
service RankingService {
    // 生成式排序
    rpc Rank(RankRequest) returns (RankResponse);
}

// 排序请求
message RankRequest {
    string user_id = 1;
    repeated string item_ids = 2;
    string trace_id = 3;
}

// 排序响应
message RankResponse {
    int32 status_code = 1;
    string message = 2;
    repeated RankedItem items = 3;
    string trace_id = 4;
}

// 排序后的商品
message RankedItem {
    string item_id = 1;
    double score = 2;
    int32 rank = 3;
}
