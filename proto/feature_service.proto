syntax="proto3";
package LinQuickRec;

option cc_generic_services = true;

message KRFeatureRequest {
  int64 user_id = 1;
  int64 log_start = 2;
  int64 log_end = 3;
  bool need_user_feature = 4;
}

message KRUserFeature {
  // one-hot encoding features
  int64 user_active_degree = 1;
  int64 follow_user_num_range = 2;
  int64 fans_user_num_range = 3;
  int64 friend_user_num_range = 4;
  int64 register_days_range = 5;
}

message KRUserLogFeature {
  int64 video_id = 1;
  int64 time_ms = 2;
  int64 action_weights = 3;
  int64 play_time_ms = 4;
  int64 duration_ms = 5;
}

message KRFeatureResponse {
  repeated KRUserLogFeature user_log_features = 1;
  optional KRUserFeature user_features = 2;
}

service FeatureService {
  rpc GetKRFeatures(KRFeatureRequest) returns (KRFeatureResponse);
};
