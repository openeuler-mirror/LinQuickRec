syntax = "proto3";

package precompute;

// 前置计算服务定义
service PrecomputeService {
    // 用户特征编码
    rpc EncodeUserFeatures(EncodeUserFeaturesRequest) returns (EncodeUserFeaturesResponse);
}

// 用户特征编码请求
message EncodeUserFeaturesRequest {
    string user_id = 1;
    UserFeatures user_features = 2;
    string trace_id = 3;
}

// 用户特征
message UserFeatures {
    string user_id = 1;
    map<string, float> dense_features = 2;
    map<string, int64> sparse_features = 3;
}

// 用户特征编码响应
message EncodeUserFeaturesResponse {
    int32 status_code = 1;
    string message = 2;
    string tensor_key = 3;  // KVWorker 中的 key
    bytes tensor_data = 4;   // 8MB tensor
    string trace_id = 5;
}
