syntax="proto3";
package LinQuickRec;

option cc_generic_services = true;

message KRRecallRequest {
  uint64 user_id = 1;
  repeated uint32 user_logs = 2;
};

message KRRecallResponse {
  repeated int32 results = 1;
};

service RecallService {
  rpc KRRecall(KRRecallRequest) returns (KRRecallResponse);
};
