syntax = "proto3";

package proxy;

// 启用 C++ 通用服务代码生成
option cc_generic_services = true;

// 网关服务 - 推荐请求
message RecommendRequest {
    uint64 user_id = 1;
    string payload = 2;
}

// 网关服务 - 推荐响应
message RecommendResponse {
    repeated uint64 candidates = 1;
    int32 error_code = 2;       // 0 = 成功，非 0 = 错误码
    string error_message = 3;   // 错误描述（仅在 error_code != 0 时有意义）
}

// 网关服务定义
service Proxy {
    rpc Recommend(RecommendRequest) returns (RecommendResponse);
}
