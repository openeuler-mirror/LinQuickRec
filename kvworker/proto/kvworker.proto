syntax = "proto3";

package kvworker;

// KVWorker 服务定义
service KVWorkerService {
    // 读取 KVCache
    rpc ReadKVCache(ReadKVCacheRequest) returns (ReadKVCacheResponse);
    // 写入 KVCache
    rpc WriteKVCache(WriteKVCacheRequest) returns (WriteKVCacheResponse);
}

// 读取 KVCache 请求
message ReadKVCacheRequest {
    string key = 1;
    string trace_id = 2;
}

// 读取 KVCache 响应
message ReadKVCacheResponse {
    int32 status_code = 1;
    string message = 2;
    bytes data = 3;
    string trace_id = 4;
}

// 写入 KVCache 请求
message WriteKVCacheRequest {
    string key = 1;
    bytes data = 2;
    int32 ttl_seconds = 3;
    string trace_id = 4;
}

// 写入 KVCache 响应
message WriteKVCacheResponse {
    int32 status_code = 1;
    string message = 2;
    string trace_id = 3;
}
