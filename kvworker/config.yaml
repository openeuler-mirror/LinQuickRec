# KVWorker 配置文件

# 服务配置
server:
  port: 8002
  host: 0.0.0.0

# KVCache 配置
kvcache:
  # 每个用户的 block 数量
  blocks_per_user: 16
  # 每个 block 的大小（KB）
  block_size_kb: 768
  # 每用户总内存（MB）
  memory_per_user_mb: 12

# 元戎配置
onednn:
  # 是否启用
  enabled: true
  # 计算引擎
  engine: cpu
  # 内存优化级别
  memory_optimization: true

# 内存管理
memory:
  # 总内存限制（GB）
  total_memory_gb: 32
  # 内存池大小
  pool_size_mb: 1024

# 日志配置
logging:
  level: info
  file: /app/logs/kvworker.log
