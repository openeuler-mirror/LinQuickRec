# Discovery 服务发现中心
apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: linquickrec
  labels:
    app: discovery-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      initContainers:
      - name: wait-for-etcd
        image: linquickrec/base:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for etcd (etcd-client:2379)..."
          for i in $(seq 1 60); do
            if curl -fsS http://etcd-client:2379/health > /dev/null 2>&1; then
              echo "etcd is ready!"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 1
          done
          echo "etcd not ready after 60s" >&2
          exit 1
      containers:
      - name: discovery
        image: linquickrec/discovery:latest
        ports:
        - containerPort: 8100
          name: rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8100"
        readinessProbe:
          tcpSocket:
            port: 8100
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8100
          initialDelaySeconds: 10
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
      volumes:
      - name: log
        emptyDir: {}
