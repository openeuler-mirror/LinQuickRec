# Recall 召回服务（KVCache 模式，无 vLLM，无需 GPU 节点）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-service
  namespace: linquickrec
  labels:
    app: recall-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recall-service
  template:
    metadata:
      labels:
        app: recall-service
    spec:
      hostIPC: true
      initContainers:
      - name: wait-for-etcd
        image: linquickrec/base:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for etcd (etcd-client:2379)..."
          for i in $(seq 1 60); do
            if curl -fsS http://etcd-client:2379/health > /dev/null 2>&1; then
              echo "etcd is ready!"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 1
          done
          echo "etcd not ready after 60s" >&2
          exit 1
      containers:
      - name: recall
        image: linquickrec/recall:latest
        ports:
        - containerPort: 8002
          name: rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8002"
        - name: ENABLE_VLLM
          value: "false"
        - name: HOST_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: "2"
            memory: "2Gi"
        readinessProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 30
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: log
        emptyDir: {}
      - name: shm
        hostPath:
          path: /dev/shm
