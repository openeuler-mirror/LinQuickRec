# Recall 召回服务（含 vLLM，需要 GPU 节点）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-service
  namespace: linquickrec
  labels:
    app: recall-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recall-service
  template:
    metadata:
      labels:
        app: recall-service
    spec:
      initContainers:
      - name: wait-for-etcd
        image: linquickrec/base:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for etcd (etcd-client:2379)..."
          for i in $(seq 1 60); do
            if curl -fsS http://etcd-client:2379/health > /dev/null 2>&1; then
              echo "etcd is ready!"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 1
          done
          echo "etcd not ready after 60s" >&2
          exit 1
      containers:
      - name: recall
        image: linquickrec/recall:latest
        ports:
        - containerPort: 8002
          name: rpc
        - containerPort: 8000
          name: vllm
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8002"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
        readinessProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 120
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 180
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
        - name: cuda
          mountPath: /usr/local/cuda
        - name: model-name
          mountPath: /app/models/Qwen3-0.6B
      volumes:
      - name: log
        emptyDir: {}
      - name: cuda
        hostPath:
          path: /usr/local/cuda-12.9
      - name: model-name
        hostPath:
          path: ../../share/Qwen3-0.6B
