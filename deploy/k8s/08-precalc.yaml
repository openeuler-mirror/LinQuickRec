# Precalc 前置计算服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precalc-service
  namespace: linquickrec
  labels:
    app: precalc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: precalc-service
  template:
    metadata:
      labels:
        app: precalc-service
    spec:
      containers:
      - name: precalc
        image: 192.168.84.245:5000/linquickrec/precalc:latest
        ports:
        - containerPort: 8003
          name: rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8003"
        - name: HOST_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
      volumes:
      - name: log
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: precalc-service
  namespace: linquickrec
spec:
  selector:
    app: precalc-service
  ports:
  - name: rpc
    port: 8003
    targetPort: 8003
  type: ClusterIP
