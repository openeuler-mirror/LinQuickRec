# RankSub 精排子图服务（可水平扩展）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rank-sub-service
  namespace: linquickrec
  labels:
    app: rank-sub-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rank-sub-service
  template:
    metadata:
      labels:
        app: rank-sub-service
    spec:
      containers:
      - name: rank-sub
        image: 192.168.84.245:5000/linquickrec/rank-sub:latest
        ports:
        - containerPort: 8005
          name: rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8005"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8005
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
      volumes:
      - name: log
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rank-sub-service
  namespace: linquickrec
spec:
  selector:
    app: rank-sub-service
  ports:
  - name: rpc
    port: 8005
    targetPort: 8005
  type: ClusterIP
