# RankSub 精排子图服务（可水平扩展）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rank-sub-service
  namespace: linquickrec
  labels:
    app: rank-sub-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: rank-sub-service
  template:
    metadata:
      labels:
        app: rank-sub-service
    spec:
      # datasystem KVClient 通过同节点共享内存读取 kv-worker 中的预计算结果，
      # 需共享主机 IPC 命名空间并挂载宿主机 /dev/shm。
      hostIPC: true
      containers:
      - name: rank-sub
        image: 192.168.84.245:5000/linquickrec/rank-sub:latest
        securityContext:
          privileged: true
        ports:
        - containerPort: 8005
          name: rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8005"
        - name: HOST_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 8005
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8005
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: log
        emptyDir: {}
      - name: shm
        hostPath:
          path: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: rank-sub-service
  namespace: linquickrec
spec:
  selector:
    app: rank-sub-service
  ports:
  - name: rpc
    port: 8005
    targetPort: 8005
  type: ClusterIP
