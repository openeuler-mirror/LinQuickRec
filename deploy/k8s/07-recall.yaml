# Recall 召回服务（含 vLLM，需要 GPU 节点）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recall-service
  namespace: linquickrec
  labels:
    app: recall-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recall-service
  template:
    metadata:
      labels:
        app: recall-service
    spec:
      containers:
      - name: recall
        image: 192.168.84.245:5000/linquickrec/recall:latest
        ports:
        - containerPort: 8002
          name: rpc
        - containerPort: 8000
          name: vllm
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8002"
        resources:
          requests:
            cpu: "2"
            memory: "8Gi"
            nvidia.com/gpu: 1
          limits:
            nvidia.com/gpu: 1
        readinessProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 120
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8002
          initialDelaySeconds: 180
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
        - name: cuda
          mountPath: /usr/local/cuda
        - name: model-name
          mountPath: /app/models/Qwen3-0.6B
      volumes:
      - name: log
        emptyDir: {}
      - name: cuda
        hostPath:
          path: /usr/local/cuda-12.9
      - name: model-name
        hostPath:
          path: ../../share/Qwen3-0.6B
---
apiVersion: v1
kind: Service
metadata:
  name: recall-service
  namespace: linquickrec
spec:
  selector:
    app: recall-service
  ports:
  - name: rpc
    port: 8002
    targetPort: 8002
  - name: vllm
    port: 8000
    targetPort: 8000
  type: ClusterIP
