# RankSub 精排子图服务（可水平扩展）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rank-sub-service
  namespace: lingquickrec
  labels:
    app: rank-sub-service
spec:
  replicas: 10
  selector:
    matchLabels:
      app: rank-sub-service
  template:
    metadata:
      labels:
        app: rank-sub-service
    spec:
      containers:
      - name: rank-sub
        image: lingquickrec/rank-sub:latest
        ports:
        - containerPort: 8006
          name: rpc
        envFrom:
        - configMapRef:
            name: lingquickrec-config
        env:
        - name: SERVER_PORT
          value: "8006"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 8006
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8006
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/lingquickrec
      volumes:
      - name: log
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rank-sub-service
  namespace: lingquickrec
spec:
  selector:
    app: rank-sub-service
  ports:
  - name: rpc
    port: 8006
    targetPort: 8006
  type: ClusterIP
