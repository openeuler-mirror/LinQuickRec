# Proxy 网关服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy-service
  namespace: linquickrec
  labels:
    app: proxy-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: proxy-service
  template:
    metadata:
      labels:
        app: proxy-service
    spec:
      initContainers:
      - name: wait-for-etcd
        image: linquickrec/base:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for etcd (etcd-client:2379)..."
          for i in $(seq 1 60); do
            if curl -fsS http://etcd-client:2379/health > /dev/null 2>&1; then
              echo "etcd is ready!"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 1
          done
          echo "etcd not ready after 60s" >&2
          exit 1
      containers:
      - name: proxy
        image: linquickrec/proxy:latest
        ports:
        - containerPort: 8080
          name: rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
      volumes:
      - name: log
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: proxy-service
  namespace: linquickrec
spec:
  selector:
    app: proxy-service
  ports:
  - name: rpc
    port: 8080
    targetPort: 8080
  type: ClusterIP
