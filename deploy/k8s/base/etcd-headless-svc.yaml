# etcd Headless Service
# publishNotReadyAddresses: true 确保 Pod 启动时 DNS 即可用，
# 避免 etcd 集群初始选举因 DNS 解析失败而无法形成。
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: linquickrec
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380
