# Precalc-and-Rank-Master 合并服务（PrecalcService :8003 + RankMasterService :8004）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precalc-and-rank-master-service
  namespace: linquickrec
  labels:
    app: precalc-and-rank-master-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: precalc-and-rank-master-service
  template:
    metadata:
      labels:
        app: precalc-and-rank-master-service
    spec:
      hostIPC: true
      initContainers:
      - name: wait-for-etcd
        image: linquickrec/base:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for etcd (etcd-client:2379)..."
          for i in $(seq 1 60); do
            if curl -fsS http://etcd-client:2379/health > /dev/null 2>&1; then
              echo "etcd is ready!"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 1
          done
          echo "etcd not ready after 60s" >&2
          exit 1
      containers:
      - name: precalc-and-rank-master
        image: linquickrec/precalc-and-rank-master:latest
        securityContext:
          privileged: true
        ports:
        - containerPort: 8003
          name: precalc-rpc
        - containerPort: 8004
          name: rank-master-rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8003"
        - name: RANK_MASTER_SERVER_PORT
          value: "8004"
        - name: HOST_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: log
        emptyDir: {}
      - name: shm
        hostPath:
          path: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: precalc-and-rank-master-service
  namespace: linquickrec
spec:
  selector:
    app: precalc-and-rank-master-service
  ports:
  - name: precalc
    port: 8003
    targetPort: 8003
  - name: rank-master
    port: 8004
    targetPort: 8004
  type: ClusterIP
