# Precalc 前置计算服务
apiVersion: apps/v1
kind: Deployment
metadata:
  name: precalc-service
  namespace: linquickrec
  labels:
    app: precalc-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: precalc-service
  template:
    metadata:
      labels:
        app: precalc-service
    spec:
      # datasystem KVClient 通过同节点共享内存与本地 kv-worker 通信，
      # 需共享主机 IPC 命名空间并挂载宿主机 /dev/shm。
      hostIPC: true
      initContainers:
      - name: wait-for-etcd
        image: linquickrec/base:latest
        command:
        - sh
        - -c
        - |
          echo "Waiting for etcd (etcd-client:2379)..."
          for i in $(seq 1 60); do
            if curl -fsS http://etcd-client:2379/health > /dev/null 2>&1; then
              echo "etcd is ready!"
              exit 0
            fi
            echo "  attempt $i/60..."
            sleep 1
          done
          echo "etcd not ready after 60s" >&2
          exit 1
      containers:
      - name: precalc
        image: linquickrec/precalc:latest
        securityContext:
          privileged: true
        ports:
        - containerPort: 8003
          name: rpc
        envFrom:
        - configMapRef:
            name: linquickrec-config
        env:
        - name: SERVER_PORT
          value: "8003"
        - name: HOST_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        readinessProbe:
          tcpSocket:
            port: 8003
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 8003
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: log
          mountPath: /var/log/linquickrec
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: log
        emptyDir: {}
      - name: shm
        hostPath:
          path: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: precalc-service
  namespace: linquickrec
spec:
  selector:
    app: precalc-service
  ports:
  - name: rpc
    port: 8003
    targetPort: 8003
  type: ClusterIP
