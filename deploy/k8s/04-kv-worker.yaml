# KV Worker（元戎 Datasystem）
# 改为 DaemonSet：datasystem 客户端（precalc/rank-sub）通过同节点共享内存
# （/dev/shm + hostIPC）与本地 worker 通信，且 KVClient 使用
# PREFERRED_SAME_NODE 亲和策略，因此每个调度了客户端的节点都必须有一个本地 worker。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kv-worker
  namespace: linquickrec
  labels:
    app: kv-worker
spec:
  selector:
    matchLabels:
      app: kv-worker
  template:
    metadata:
      labels:
        app: kv-worker
    spec:
      hostIPC: true
      containers:
      - name: kv-worker
        image: 192.168.84.245:5000/linquickrec/kv-worker:latest
        ports:
        - containerPort: 31501
          name: worker
        - containerPort: 31502
          name: worker2
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: worker_address
          value: "$(POD_IP):31501"
        - name: etcd_address
          value: "etcd-client:2379"
        - name: enable_urma
          value: "0"
        - name: cpu_affinity
          value: "0-64"
        - name: HOST_ID
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        envFrom:
        - configMapRef:
            name: linquickrec-config
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        securityContext:
          privileged: true
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: shm
        hostPath:
          path: /dev/shm
---
apiVersion: v1
kind: Service
metadata:
  name: kv-worker
  namespace: linquickrec
spec:
  selector:
    app: kv-worker
  ports:
  - name: worker
    port: 31501
    targetPort: 31501
  - name: worker2
    port: 31502
    targetPort: 31502
  type: ClusterIP
