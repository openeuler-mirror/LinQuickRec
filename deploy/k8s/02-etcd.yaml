# etcd 集群（5 副本 StatefulSet）
# Headless Service 提供稳定 DNS（etcd-0.etcd.linquickrec.svc.cluster.local）
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: linquickrec
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380
---
# Client Service（ClusterIP 供业务服务连接）
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: linquickrec
spec:
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  type: ClusterIP
---
