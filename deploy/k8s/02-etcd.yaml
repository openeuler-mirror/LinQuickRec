# etcd 集群（5 副本 StatefulSet）
# Headless Service 提供稳定 DNS（etcd-0.etcd.linquickrec.svc.cluster.local）
apiVersion: v1
kind: Service
metadata:
  name: etcd
  namespace: linquickrec
spec:
  clusterIP: None
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  - name: peer
    port: 2380
    targetPort: 2380
---
# Client Service（ClusterIP 供业务服务连接）
apiVersion: v1
kind: Service
metadata:
  name: etcd-client
  namespace: linquickrec
spec:
  selector:
    app: etcd
  ports:
  - name: client
    port: 2379
    targetPort: 2379
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  namespace: linquickrec
  labels:
    app: etcd
spec:
  serviceName: etcd
  podManagementPolicy: Parallel
  replicas: 5
  selector:
    matchLabels:
      app: etcd
  template:
    metadata:
      labels:
        app: etcd
    spec:
      containers:
      - name: etcd
        image: linquickrec/etcd:latest
        ports:
        - containerPort: 2379
          name: client
        - containerPort: 2380
          name: peer
        env:
        - name: DATA_DIR
          value: /var/lib/etcd
        - name: CLUSTER_SIZE
          value: "5"
        - name: SERVICE_NAME
          value: "etcd"
        - name: CLUSTER_NS
          value: "linquickrec"
        readinessProbe:
          exec:
            command:
            - etcdctl
            - endpoint
            - health
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec:
            command:
            - etcdctl
            - endpoint
            - health
          initialDelaySeconds: 15
          periodSeconds: 15
        volumeMounts:
        - name: etcd-data
          mountPath: /var/lib/etcd
  volumeClaimTemplates:
  - metadata:
      name: etcd-data
    spec:
      storageClassName: local-storage
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
