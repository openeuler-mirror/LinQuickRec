# LingQuickRec Docker Compose — 仅用于镜像构建
#
# ENABLE_VLLM 通过 .env 文件控制，编辑 deploy/docker/.env 切换模式：
#   ENABLE_VLLM=false  →  novllm 模式（KVCache，无需 GPU）
#   ENABLE_VLLM=true   →  vLLM 模式（需 GPU + 模型）
#
# 构建命令：
#   docker compose build                                    # 基础服务 + recall
#   docker compose --profile discovery-server build          # 基础服务 + recall + discovery
#
# 删除所有构建产物（镜像）：
#   docker compose down --rmi all
#
# 容器启动通过 deploy.sh 或 kubectl apply 管理，不在此文件中配置。

services:
  etcd:
    build:
      context: ../..
      dockerfile: deploy/docker/etcd/Dockerfile
    image: linquickrec/etcd:latest

  kv-worker:
    build:
      context: ../..
      dockerfile: deploy/docker/kv_worker/Dockerfile
    image: linquickrec/kv-worker:latest

  feature:
    build:
      context: ../..
      dockerfile: deploy/docker/feature/Dockerfile
    image: linquickrec/feature:latest

  precalc-and-rank-master:
    build:
      context: ../..
      dockerfile: deploy/docker/precalc-and-rank-master/Dockerfile
    image: linquickrec/precalc-and-rank-master:latest

  rank-sub:
    build:
      context: ../..
      dockerfile: deploy/docker/rank-sub/Dockerfile
    image: linquickrec/rank-sub:latest

  proxy:
    build:
      context: ../..
      dockerfile: deploy/docker/proxy/Dockerfile
    image: linquickrec/proxy:latest

  recall:
    build:
      context: ../..
      dockerfile: deploy/docker/recall/Dockerfile
      args:
        ENABLE_VLLM: "${ENABLE_VLLM:-false}"
        PROXY_IP: "${PROXY_IP:-}"
        PROXY_PORT: "${PROXY_PORT:-3128}"
    image: linquickrec/recall:latest

  perf-collector:
    build:
      context: ../..
      dockerfile: services/perf/collector/Dockerfile
      args:
        PROXY_IP: "${PROXY_IP:-}"
        PROXY_PORT: "${PROXY_PORT:-3128}"
    image: linquickrec/perf-collector:latest

  # === --profile discovery-server 时构建 ===
  discovery-server:
    profiles:
      - discovery-server
    build:
      context: ../..
      dockerfile: deploy/docker/discovery/Dockerfile
    image: linquickrec/discovery:latest
