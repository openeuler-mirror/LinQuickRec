# Prerequisite: Build binaries on host first:
#   mkdir build && cd build && cmake .. && make discovery_server discovery_client -j$(nproc)
#   cd services/discovery/examples && mkdir build && cd build && cmake .. && make -j$(nproc)

services:
  discovery-server:
    build:
      context: ../..
      dockerfile: services/discovery/Dockerfile
    ports:
      - "8100:8100"
    container_name: discovery-server

  pseudo-recall-1:
    build:
      context: ../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: recall_service
      SERVICE_PORT: 8001
    container_name: pseudo-recall-1

  pseudo-recall-2:
    build:
      context: ../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: recall_service
      SERVICE_PORT: 8002
    container_name: pseudo-recall-2

  pseudo-feature-1:
    build:
      context: ../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: feature_service
      SERVICE_PORT: 8003
    container_name: pseudo-feature-1

  pseudo-feature-2:
    build:
      context: ../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: feature_service
      SERVICE_PORT: 8004
    container_name: pseudo-feature-2

  pseudo-proxy-1:
    build:
      context: ../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: proxy
      SERVICE_PORT: 8005
    container_name: pseudo-proxy-1

  pseudo-proxy-2:
    build:
      context: ../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: proxy
      SERVICE_PORT: 8006
    container_name: pseudo-proxy-2

  test-client:
    build:
      context: ../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    container_name: test-client
    entrypoint: ["tail", "-f", "/dev/null"]
