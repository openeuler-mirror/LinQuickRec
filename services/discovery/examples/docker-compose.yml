# Prerequisite: Build binaries on host first:
#   mkdir build && cd build && cmake .. && make discovery_server discovery_client -j$(nproc)
#   cd services/discovery/examples && mkdir build && cd build && cmake .. && make -j$(nproc)

services:
  discovery-server:
    build:
      context: ../../..
      dockerfile: services/discovery/Dockerfile
    ports:
      - "8100:8100"
    container_name: discovery-server

  pseudo-proxy:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: proxy
      SERVICE_PORT: 8001
    container_name: pseudo-proxy

  pseudo-feature:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: feature_service
      SERVICE_PORT: 8002
    container_name: pseudo-feature

  pseudo-recall-1:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: recall_service
      SERVICE_PORT: 8003
    container_name: pseudo-recall-1

  pseudo-recall-2:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: recall_service
      SERVICE_PORT: 8003
    container_name: pseudo-recall-2

  pseudo-recall-3:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: recall_service
      SERVICE_PORT: 8003
    container_name: pseudo-recall-3

  pseudo-rank-1:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: rank_service
      SERVICE_PORT: 8004
    container_name: pseudo-rank-1

  pseudo-rank-2:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: rank_service
      SERVICE_PORT: 8004
    container_name: pseudo-rank-2

  pseudo-rank-3:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    environment:
      SERVICE_TYPE: rank_service
      SERVICE_PORT: 8004
    container_name: pseudo-rank-3

  test-client:
    build:
      context: ../../..
      dockerfile: services/discovery/examples/Dockerfile
    depends_on:
      - discovery-server
    container_name: test-client
    entrypoint: ["tail", "-f", "/dev/null"]
