version: '3.8'

services:
  # Redis 服务
  redis:
    image: redis:7-alpine
    container_name: lingquickrec-redis
    ports:
      - "6379:6379"
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - lingquickrec-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # KVWorker 服务（搭载元戎）
  kvworker:
    build:
      context: .
      dockerfile: kvworker/Dockerfile
    container_name: lingquickrec-kvworker
    ports:
      - "8002:8002"
    volumes:
      - ./kvworker/config.yaml:/app/config.yaml
    environment:
      - ONEDNN_ROOT=/opt/onednn
    depends_on:
      - redis
    networks:
      - lingquickrec-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # 特征服务
  feature:
    build:
      context: .
      dockerfile: services/feature/Dockerfile
    container_name: lingquickrec-feature
    ports:
      - "8003:8003"
    depends_on:
      - redis
    networks:
      - lingquickrec-network
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # 召回服务
  recall:
    build:
      context: .
      dockerfile: services/recall/Dockerfile
    container_name: lingquickrec-recall
    ports:
      - "8001:8001"
    depends_on:
      - kvworker
    networks:
      - lingquickrec-network
    environment:
      - KVWORKER_HOST=kvworker
      - KVWORKER_PORT=8002

  # 前置计算服务
  precompute:
    build:
      context: .
      dockerfile: services/precompute/Dockerfile
    container_name: lingquickrec-precompute
    ports:
      - "8004:8004"
    depends_on:
      - kvworker
    networks:
      - lingquickrec-network
    environment:
      - KVWORKER_HOST=kvworker
      - KVWORKER_PORT=8002

  # 排序服务
  ranking:
    build:
      context: .
      dockerfile: services/ranking/Dockerfile
    container_name: lingquickrec-ranking
    ports:
      - "8005:8005"
    depends_on:
      - kvworker
      - recall
      - precompute
    networks:
      - lingquickrec-network
    environment:
      - KVWORKER_HOST=kvworker
      - KVWORKER_PORT=8002
      - RECALL_HOST=recall
      - PRECOMPUTE_HOST=precompute

  # 网关服务
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: lingquickrec-gateway
    ports:
      - "8080:8080"
    depends_on:
      - feature
      - recall
      - ranking
      - precompute
    networks:
      - lingquickrec-network
    environment:
      - FEATURE_HOST=feature
      - RECALL_HOST=recall
      - RANKING_HOST=ranking
      - PRECOMPUTE_HOST=precompute

networks:
  lingquickrec-network:
    driver: bridge
